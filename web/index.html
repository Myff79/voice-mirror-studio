<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Mirror Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f7f2;
      --muted: #a8ada5;
      --panel: #141714;
      --panel-2: #1c201c;
      --line: #323832;
      --acid: #c8ff3d;
      --violet: #9988ff;
      --danger: #ff806d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 15%, rgba(153,136,255,.16), transparent 30rem),
        radial-gradient(circle at 85% 80%, rgba(200,255,61,.10), transparent 28rem),
        #090b09;
      color: var(--ink);
      font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button, input, textarea { font: inherit; }
    .shell { max-width: 1440px; margin: 0 auto; padding: 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4.5rem); letter-spacing: -.065em; line-height: .88; max-width: 680px; }
    h1 span { color: var(--acid); }
    .eyebrow { color: var(--muted); text-transform: uppercase; letter-spacing: .13em; font-size: .8rem; font-weight: 700; }
    .status { display: flex; align-items: center; gap: 10px; color: var(--muted); white-space: nowrap; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #626862; box-shadow: 0 0 0 5px rgba(98,104,98,.12); }
    .dot.live { background: var(--acid); box-shadow: 0 0 20px rgba(200,255,61,.8); }
    .workspace { display: grid; grid-template-columns: minmax(0, .9fr) minmax(360px, 1.1fr); gap: 18px; }
    .panel { background: rgba(20,23,20,.93); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
    .panel-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-body { padding: 20px; }
    label { display: block; color: var(--muted); font-size: .88rem; margin-bottom: 8px; }
    textarea, input {
      width: 100%; color: var(--ink); background: #0c0f0c; border: 1px solid var(--line); border-radius: 13px;
      padding: 14px; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    textarea { min-height: 240px; resize: vertical; }
    textarea:focus, input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(153,136,255,.16); }
    .field + .field { margin-top: 18px; }
    .ready { display:flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .chip { border: 1px solid var(--line); border-radius: 99px; padding: 7px 10px; color: var(--muted); font-size: .8rem; }
    .chip.ok { color: var(--acid); border-color: rgba(200,255,61,.35); }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 20px; }
    button { border: 0; border-radius: 13px; padding: 13px 18px; cursor: pointer; font-weight: 750; }
    #start { background: var(--acid); color: #11150a; }
    #stop { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .transcript { min-height: 510px; max-height: 66vh; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 13px; }
    .empty { margin: auto; text-align: center; color: var(--muted); max-width: 320px; }
    .empty strong { display:block; color: var(--ink); font-size: 1.3rem; margin-bottom: 6px; }
    .message { max-width: 82%; padding: 12px 14px; border-radius: 16px; background: var(--panel-2); align-self:flex-start; }
    .message.user { align-self:flex-end; background: var(--violet); color: white; }
    .message small { display:block; opacity:.65; font-size:.72rem; margin-bottom:4px; text-transform:uppercase; letter-spacing:.08em; }
    .error { display:none; margin-top:12px; color:var(--danger); }
    .error.show { display:block; }
    @media (max-width: 860px) {
      .shell { padding: 18px; }
      header { align-items: start; flex-direction: column; }
      .workspace { grid-template-columns: 1fr; }
      .transcript { min-height: 380px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Advanced workshop track</div>
        <h1>Talk to your <span>voice mirror.</span></h1>
      </div>
      <div class="status"><span id="dot" class="dot"></span><span id="statusText">Ready to configure</span></div>
    </header>

    <section class="workspace">
      <article class="panel">
        <div class="panel-head"><h2>Character controls</h2><span class="eyebrow">Private on this Mac</span></div>
        <div class="panel-body">
          <div class="field">
            <label for="personality">How should your agent behave?</label>
            <textarea id="personality" spellcheck="true"></textarea>
          </div>
          <div class="field">
            <label for="voiceId">Gradium voice ID</label>
            <input id="voiceId" autocomplete="off" spellcheck="false">
          </div>
          <div class="ready">
            <span id="gradiumChip" class="chip">Gradium key</span>
            <span id="livekitChip" class="chip">LiveKit project</span>
          </div>
          <div class="actions">
            <button id="start">Start conversation</button>
            <button id="stop" disabled>Stop</button>
          </div>
          <p id="error" class="error" role="alert"></p>
        </div>
      </article>

      <article class="panel">
        <div class="panel-head"><h2>Conversation</h2><span id="messageCount" class="eyebrow">0 messages</span></div>
        <div id="transcript" class="transcript" aria-live="polite">
          <div class="empty"><strong>Your transcript appears here.</strong>Start the conversation, then speak naturally. Your microphone and speakers stay on this computer.</div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const personality = $('#personality');
    const voiceId = $('#voiceId');
    let initialized = false;

    function renderMessages(messages) {
      const transcript = $('#transcript');
      $('#messageCount').textContent = `${messages.length} message${messages.length === 1 ? '' : 's'}`;
      if (!messages.length) {
        transcript.innerHTML = '<div class="empty"><strong>Your transcript appears here.</strong>Start the conversation, then speak naturally. Your microphone and speakers stay on this computer.</div>';
        return;
      }
      transcript.innerHTML = messages.map(message => {
        const role = message.role === 'user' ? 'You' : 'Voice mirror';
        const safe = message.text.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
        return `<div class="message ${message.role === 'user' ? 'user' : ''}"><small>${role}</small>${safe}</div>`;
      }).join('');
      transcript.scrollTop = transcript.scrollHeight;
    }

    async function refresh() {
      try {
        const state = await fetch('/api/state').then(response => response.json());
        if (!initialized) {
          personality.value = state.personality;
          voiceId.value = state.voiceId;
          initialized = true;
        }
        $('#gradiumChip').classList.toggle('ok', state.gradiumReady);
        $('#gradiumChip').textContent = state.gradiumReady ? 'Gradium ready' : 'Gradium key missing';
        $('#livekitChip').classList.toggle('ok', state.livekitReady);
        $('#livekitChip').textContent = state.livekitReady ? 'LiveKit ready' : 'LiveKit not connected';
        $('#dot').classList.toggle('live', state.running);
        $('#statusText').textContent = state.running ? 'Conversation live' : 'Ready to configure';
        $('#start').disabled = state.running || !state.gradiumReady || !state.livekitReady;
        $('#stop').disabled = !state.running;
        personality.disabled = state.running;
        voiceId.disabled = state.running;
        const error = $('#error');
        error.textContent = state.error || '';
        error.classList.toggle('show', Boolean(state.error));
        renderMessages(state.transcript);
      } catch (_) {
        $('#statusText').textContent = 'Studio disconnected';
      }
    }

    async function action(path) {
      const response = await fetch(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({personality: personality.value, voiceId: voiceId.value})
      });
      if (!response.ok) throw new Error(await response.text());
      await refresh();
    }

    $('#start').addEventListener('click', async () => {
      $('#error').classList.remove('show');
      try { await action('/api/start'); }
      catch (error) { $('#error').textContent = error.message; $('#error').classList.add('show'); }
    });
    $('#stop').addEventListener('click', async () => {
      try { await fetch('/api/stop', {method:'POST'}); await refresh(); }
      catch (error) { $('#error').textContent = error.message; $('#error').classList.add('show'); }
    });

    refresh();
    setInterval(refresh, 900);
  </script>
</body>
</html>
